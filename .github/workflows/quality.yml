name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:js
      - run: npm run test:widgets

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean plugin package
        run: |
          mkdir -p build/wp-builder
          rsync -a --exclude-from=.distignore ./ build/wp-builder/
          cd build && zip -qr wp-builder-0.6.0.zip wp-builder
          test -s wp-builder-0.6.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wp-builder-0.6.0
          path: build/wp-builder-0.6.0.zip
