name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:js
      - run: npm run test:widgets
      - run: npm run test:editor

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean plugin
        run: |
          mkdir -p "$RUNNER_TEMP/pagevia"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/pagevia/"
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/pagevia

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean plugin package
        run: |
          mkdir -p "$RUNNER_TEMP/pagevia"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/pagevia/"
          cd "$RUNNER_TEMP" && zip -qr pagevia-1.4.0.zip pagevia
          test -s pagevia-1.4.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pagevia-1.4.0
          path: ${{ runner.temp }}/pagevia-1.4.0.zip
