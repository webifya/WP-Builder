name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:js
      - run: npm run test:widgets

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean plugin directory
        run: |
          mkdir -p dist/wp-builder
          rsync -a --exclude-from=.distignore ./ dist/wp-builder/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './dist/wp-builder'
          slug: 'wp-builder'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean plugin package
        run: |
          VERSION=$(sed -nE 's/^ \* Version:[[:space:]]*([0-9.]+).*/\1/p' wp-builder.php)
          test -n "$VERSION"
          mkdir -p dist/wp-builder
          rsync -a --exclude-from=.distignore ./ dist/wp-builder/
          cd dist
          zip -qr "wp-builder-${VERSION}.zip" wp-builder
          test -s "wp-builder-${VERSION}.zip"
          echo "WPB_PACKAGE=dist/wp-builder-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "WPB_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: wp-builder-${{ env.WPB_VERSION }}
          path: ${{ env.WPB_PACKAGE }}
